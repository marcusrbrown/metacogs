name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The MCP protocol tests spawn `node` from PATH; the shipped bundle targets the Node 22 floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          METACOGS_REQUIRE_HOST: '1'
      - run: bun run generate:check
      - run: bun run matrix:check
      - run: bun run scan:secrets
      # Pull requests only. The gate fetches the base commit itself, since checkout is shallow.
      - name: Changeset gate
        if: github.event_name == 'pull_request'
        run: bun run changeset:gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
