name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The MCP protocol tests spawn `node` from PATH; the shipped bundle targets the Node 22 floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          METACOGS_REQUIRE_HOST: '1'
      - run: bun run generate:check
      - run: bun run matrix:check
      - run: bun run scan:secrets
      # The pinned Claude CLI validates the marketplace and the plugin. It needs no login and no network. npm 12 blocks
      # the package's postinstall and `npx -y` fails on it, so install without scripts and run install.cjs by hand.
      - name: Install the pinned Claude CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.312
          node "$RUNNER_TEMP/claude-cli/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      # The test runs the CLI with an isolated HOME and CLAUDE_CONFIG_DIR in a temp directory.
      - name: Validate the Claude plugin
        run: bun test src/hosts/claude-validate.test.ts
        env:
          DISABLE_TELEMETRY: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          METACOGS_HOST_VALIDATE: '1'
      # Pull requests only. The gate fetches the base commit itself, since checkout is shallow.
      - name: Changeset gate
        if: github.event_name == 'pull_request'
        run: bun run changeset:gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

  # Required check: runs the packed plugin on the pinned OpenCode v2 CLI against the scripted provider.
  opencode-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # npm 12 blocks install scripts unless told otherwise; older npm does not know the flag.
      - name: Install the pinned OpenCode v2 CLI
        id: opencode
        run: |
          pin="$(node -p "require('./package.json').testedWith['opencode-v2']")"
          prefix="$RUNNER_TEMP/opencode-v2"
          flags=(--no-audit --no-fund)
          if (( $(npm --version | cut -d. -f1) >= 12 )); then
            flags+=(--dangerously-allow-all-scripts)
          fi
          echo "npm $(npm --version), installing @opencode/cli@${pin} into $prefix"
          npm install --prefix "$prefix" "@opencode/cli@${pin}" "${flags[@]}"
          bin="$prefix/node_modules/.bin/opencode"
          if ! reported="$("$bin" --version 2>&1)"; then
            echo "::error::$bin --version failed: $reported"
            exit 1
          fi
          echo "$bin --version: $reported"
          if [[ "$reported" != "opencode v${pin}" ]]; then
            echo "::error::Expected 'opencode v${pin}' but the installed CLI reported '$reported'"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Run the OpenCode v2 contract suite
        run: bun test src/plugin/v2-integration.test.ts
        env:
          METACOGS_HOST_V2: '1'
          METACOGS_OPENCODE_V2_BIN: ${{ steps.opencode.outputs.bin }}
