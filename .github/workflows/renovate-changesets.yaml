---
name: Renovate Changesets

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Changesets only when a PR changes runtime dependencies or shipped files; the shared action cannot tell dev from runtime bumps.
  scope:
    name: Detect Bundle-Affecting Update
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      (github.actor == 'renovate[bot]' || github.actor == 'mrbro-bot[bot]')
    runs-on: ubuntu-latest
    outputs:
      bundle-affecting: ${{ steps.diff.outputs.bundle-affecting }}
    steps:
      - id: diff
        name: Compare runtime dependencies and shipped files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          runtime_deps() {
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/${REPO}/contents/package.json?ref=$1" |
              jq -S -c '[.dependencies, .peerDependencies, .optionalDependencies]'
          }

          compare=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}")
          merge_base=$(jq -r '.merge_base_commit.sha' <<<"$compare")

          base_deps=$(runtime_deps "$merge_base")
          head_deps=$(runtime_deps "$HEAD_SHA")

          if [ "$base_deps" != "$head_deps" ]; then
            reason='runtime dependencies changed'
          elif jq -e 'any(.files[]; .filename | startswith("skills/") or startswith("dist/") or startswith("plugin/") or startswith("hosts/") or startswith(".claude-plugin/") or startswith(".agents/plugins/"))' <<<"$compare" >/dev/null; then
            reason='shipped files changed'
          else
            reason=''
          fi

          if [ -n "$reason" ]; then
            echo "Bundle-affecting: ${reason}"
            echo 'bundle-affecting=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Not bundle-affecting: no runtime dependency or shipped file changes; no changeset needed'
            echo 'bundle-affecting=false' >> "$GITHUB_OUTPUT"
          fi

  renovate-changesets:
    name: Create Renovate Changeset
    needs: scope
    if: needs.scope.outputs.bundle-affecting == 'true'
    secrets:
      APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
      APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}
    uses: bfra-me/.github/.github/workflows/renovate-changeset.yaml@e6a1ab17bb68213940f63de91bd0450acdf9fff4 # v4.43.0
    with:
      target-package: metacogs
