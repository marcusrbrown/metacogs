---
_extends: .github:common-settings.yaml

repository:
  name: metacogs
  description: Explicit, testable reasoning methods packaged as portable Agent Skills
  homepage: https://github.com/marcusrbrown/metacogs
  topics: [agent-skills, reasoning, evals, opencode, claude-code, codex]

# Applied by the settings workflow, which deletes any ruleset not listed here.
rulesets:
  # No actor bypasses this ruleset. An admin can still edit or disable it under
  # Settings → Rules as the escape hatch.
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ['~DEFAULT_BRANCH']
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_last_push_approval: true
          require_code_owner_review: false
          required_review_thread_resolution: false
          allowed_merge_methods: [squash]
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: false
          required_status_checks:
            - {context: check, integration_id: 15368}
            - {context: Fro Bot, integration_id: 15368}
    bypass_actors: []

  # Release tags are immutable: no moves, no deletes. Creation stays open so the
  # release workflow can push new tags.
  - name: release-tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include: ['refs/tags/v*']
        exclude: []
    rules:
      - type: update
      - type: deletion
    bypass_actors: []
